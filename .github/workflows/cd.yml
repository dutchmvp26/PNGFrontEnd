name: Frontend CD

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: self-hosted
    environment: production
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false

    steps:
      - name: Check out the commit that CI tested
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Make sure the Docker network exists
        run: docker network create png-network || true

      - name: Build Docker image
        run: docker build -t pngfrontend .

      - name: Replace running container
        run: |
          docker rm -f pngfrontend || true
          docker run -d \
            --name pngfrontend \
            -p 80:80 \
            --restart unless-stopped \
            --network png-network \
            pngfrontend

      - name: Remove old images
        run: docker image prune -f