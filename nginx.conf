server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Send API calls to the Spring Boot backend on the same VM
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
    }

    # React Router: unknown paths like /rooms/AB12CD serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}