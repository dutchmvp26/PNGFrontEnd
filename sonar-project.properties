# SonarQube Cloud settings for the frontend
sonar.organization=dutchmvp26
sonar.projectKey=dutchmvp26_PNGFrontEnd
sonar.projectName=PNG Frontend

# Which code to analyse
sonar.sources=src
sonar.exclusions=**/node_modules/**,dist/**,coverage/**
sonar.sourceEncoding=UTF-8

# Coverage report (only used once you have frontend tests that produce one)
sonar.javascript.lcov.reportPaths=coverage/lcov.info